<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
</head>

<body>
    <main>
        <section class="area-esquerda">
            <!--
           <img src="LogoPetshop.png" alt="logo petshop" class="logo">
            -->
            
            <img src="ImagemDestaque.png" alt="Imagem destaque" class="imagem-destaque">
        </section>
        <section class="area-direita">
            <form class="area-login">
                <img src="ImagemUser.png" alt="">
                <input type="email" name="email" placeholder="Email" required>

                <input type="password" name="senha" placeholder="Senha" required>

                <button type="submit" id="login">Entrar</button>

                <div class="separador">
                    <hr>
                    <span>ou</span>
                    <hr>
                </div>

                <button type="button" class="botao-google">
                    <img src="LogoGoogle.png" alt="" style="max-width: 100px; height: auto;">
                    Entrar com o Google
                </button>

                <a href="#">Esqueci minha senha</a>
            </form>
        </section>

    </main>
    <footer>
        67
    </footer>
</body>

</html>
