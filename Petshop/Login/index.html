
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login CãoMania</title>
</head>
<body>
    <main>
        <section class="area-esquerda">
            <img class="logo" src="LogoPetshop.png" alt="Logo CãoMania PetShop">

            <img class="imagem-destaque" src="ImagemDestaque.png" alt="Filhote de cachorro">
        </section>

        <form class="area-login">
            <img src="ImagemUser.png" alt="" id="ImagemUser">
            <input type="email" name="email" placeholder="Email" required>

            <input type="password" name="senha" placeholder="Senha" required>

            <button type="submit" id="login">Entrar</button>

            <div class="separador">
                <hr>
                <span>ou</span>
                <hr>
            </div>

            <button type="button" class="botao-google">
                <img src="LogoGoogle.png" alt="">
                Entrar com o Google
            </button>

            <a href="#">Esqueci minha senha</a>
        </form>
    </main>
    <footer class="rodape">
    <section>
        <h3>CãoMania PetShop</h3>
        <p>Cuidando de quem faz parte da sua família.</p>
    </section>

    <section>
        <h3>Contato</h3>
        <p>Email: contato@caomania.com</p>
        <p>Telefone: (47) 99999-9999</p>
    </section>

    <section>
        <h3>Horário de funcionamento</h3>
        <p>Segunda a sexta: 08h às 18h</p>
        <p>Sábado: 08h às 12h</p>
    </section>

    <p class="direitos">
        © 2026 CãoMania PetShop - Todos os direitos reservados.
    </p>
</footer>
</body>
</html>
