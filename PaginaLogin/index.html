<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
</head>

<body>
    <main>
        <section class="area-esquerda">
            <!--
           <img src="LogoPetshop.png" alt="logo petshop" class="logo">
            -->
            
            <img src="ImagemDestaque.png" alt="Imagem destaque" class="imagem-destaque">
        </section>
        <section class="area-direita">
            <form class="area-login">
                <img src="ImagemUser.png" alt="">
                <input type="email" name="email" placeholder="Email" required>

                <input type="password" name="senha" placeholder="Senha" required>

                <button type="submit" id="login">Entrar</button>

                <div class="separador">
                    <hr>
                    <span>ou</span>
                    <hr>
                </div>

                <button type="button" class="botao-cadastro">
                    Não tem uma conta? cadastre-se
                </button>

                <a href="#">Esqueci minha senha</a>
            </form>
        </section>

    </main>
    <footer>
        <section class="explore">
            <h2>Explore</h2>
            <a href="#">Produtos</a>
            <a href="#">Banho e tosa</a>
            <a href="#">Para gatos</a>
            <a href="#">Para cachorros</a>
        </section>
        <section class="contato">
            <h2>Contato</h2>
            <a href="#">
                <img src="IconeTelefone.png" alt="IconeTelefone">
                (99)99999-9999
            </a>
            <a href="#">
                <img src="IconeEmail.png" alt="IconeEmail">
                caomania@hotmail.com
            </a>
        </section>
        <section class="horarios">
            <h2>Horários</h2>
            <p>Seg. a Sex., 9h às 18h</p>
            <p>Sábados, 9h às 13h</p>
        </section>
        <section class="meio-pagamento">
            <h2>Meios de pagamento</h2>
            <img src="MeiosPagamento.png" alt="meios de pagamento">
        </section>
    </footer>
</body>

</html>
